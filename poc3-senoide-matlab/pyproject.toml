[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "senoide_matlab"
version = "0.1.0"
description = "PoC3: Generación de senoide usando MATLAB Engine"
requires-python = ">=3.9"
dependencies = [
    "matlabengine>=25.2.0,<25.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
]
